services:
  minecraft-bedrock:
    image: itzg/minecraft-bedrock-server
    container_name: minecraft
    ports:
      - "19132:19132/tcp"
      - "19140-19155:19140-19155/udp" 
    environment:
      EULA: "TRUE"
      GAMEMODE: survival
      DIFFICULTY: easy
      LEVEL_NAME: "YOUR_WORLD_NAME"
      MAX_PLAYERS: 5
      ALLOW_CHEATS: "false"
      ONLINE_MODE: "true"
      WHITE_LIST: "true"
      VIEW_DISTANCE: 10
      TICK_DISTANCE: 4
      TZ: "America/Manaus"
      SERVER_UDP_PORTS: "PUBLIC_IP:19140-19155:19140-19155"
    volumes:
      - ./data:/data
    restart: unless-stopped
